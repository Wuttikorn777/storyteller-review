trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:
# 1. ติดตั้ง Node.js
- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: 'Install Node.js'

# 2. ติดตั้ง dependencies จาก package.json
- script: npm install
  displayName: 'Install npm dependencies'

# 3. (สำรอง) ติดตั้ง selenium-webdriver เพิ่ม
- script: npm install selenium-webdriver
  displayName: 'Ensure selenium-webdriver installed'

# 4. ติดตั้ง Chrome + ChromeDriver ใน VM
- script: |
    sudo apt-get update
    sudo apt-get install -y chromium-browser chromium-chromedriver
    sudo ln -sf /usr/lib/chromium-browser/chromedriver /usr/bin/chromedriver
  displayName: 'Install Chromium & ChromeDriver'

# 5. สตาร์ทเซิร์ฟเวอร์ background
- script: |
    npm run start &
    echo "Waiting for server to be ready..."
    sleep 10
  displayName: 'Start server in background'

# 6. รัน Selenium UI tests
- script: node test.ui.js
  displayName: 'Run Selenium UI Tests'

# --- ต่อถ้าต้องการ Unit Tests + Coverage ---
- script: npm run test -- --coverage
  displayName: 'Run Unit Tests & Generate Coverage'

- task: PublishCodeCoverageResults@1
  inputs:
    codeCoverageTool: 'Cobertura'
    summaryFileLocation: '$(System.DefaultWorkingDirectory)/coverage/cobertura-coverage.xml'
    reportDirectory: '$(System.DefaultWorkingDirectory)/coverage'
    failIfCoverageEmpty: true
  displayName: 'Publish Code Coverage Results'
