trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: 'Install Node.js'

- script: |
    npm install
  displayName: 'Install dependencies'

- script: |
    npm install selenium-webdriver
  displayName: 'Install selenium-webdriver (manual)'
  
- script: |
    npm run start &
    sleep 10  # รอ 10 วิให้เว็บ start เสร็จก่อน
  displayName: 'Start server in background'

- script: |
    npm run selenium-test
  displayName: 'Run Selenium Tests'

# (optional) ถ้า selenium เทสเสร็จแล้ว อยากเก็บ coverage ด้วยก็ทำต่อได้
- script: |
    npm run test -- --coverage
  displayName: 'Run Unit Tests and generate coverage'

- task: PublishCodeCoverageResults@1
  inputs:
    codeCoverageTool: 'Cobertura'
    summaryFileLocation: '$(System.DefaultWorkingDirectory)/coverage/cobertura-coverage.xml'
    reportDirectory: '$(System.DefaultWorkingDirectory)/coverage'
    failIfCoverageEmpty: true
  displayName: 'Publish Code Coverage Results'
