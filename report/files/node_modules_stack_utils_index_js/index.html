const escapeStringRegexp = require(&#039;escape-string-regexp&#039;);

const cwd = typeof process === &#039;object&#039; &amp;&amp; process &amp;&amp; typeof process.cwd === &#039;function&#039;
  ? process.cwd()
  : &#039;.&#039;

const natives = [].concat(
  require(&#039;module&#039;).builtinModules,
  &#039;bootstrap_node&#039;,
  &#039;node&#039;,
).map(n =&gt; new RegExp(`(?:\\((?:node:)?${n}(?:\\.js)?:\\d+:\\d+\\)$|^\\s*at (?:node:)?${n}(?:\\.js)?:\\d+:\\d+$)`));

natives.push(
  /\((?:node:)?internal\/[^:]+:\d+:\d+\)$/,
  /\s*at (?:node:)?internal\/[^:]+:\d+:\d+$/,
  /\/\.node-spawn-wrap-\w+-\w+\/node:\d+:\d+\)?$/
);

class StackUtils {
  constructor (opts) {
    opts = {
      ignoredPackages: [],
      ...opts
    };

    if (&#039;internals&#039; in opts === false) {
      opts.internals = StackUtils.nodeInternals();
    }

    if (&#039;cwd&#039; in opts === false) {
      opts.cwd = cwd
    }

    this._cwd = opts.cwd.replace(/\\/g, &#039;/&#039;);
    this._internals = [].concat(
      opts.internals,
      ignoredPackagesRegExp(opts.ignoredPackages)
    );

    this._wrapCallSite = opts.wrapCallSite || false;
  }

  static nodeInternals () {
    return [...natives];
  }

  clean (stack, indent = 0) {
    indent = &#039; &#039;.repeat(indent);

    if (!Array.isArray(stack)) {
      stack = stack.split(&#039;\n&#039;);
    }

    if (!(/^\s*at /.test(stack[0])) &amp;&amp; (/^\s*at /.test(stack[1]))) {
      stack = stack.slice(1);
    }

    let outdent = false;
    let lastNonAtLine = null;
    const result = [];

    stack.forEach(st =&gt; {
      st = st.replace(/\\/g, &#039;/&#039;);

      if (this._internals.some(internal =&gt; internal.test(st))) {
        return;
      }

      const isAtLine = /^\s*at /.test(st);

      if (outdent) {
        st = st.trimEnd().replace(/^(\s+)at /, &#039;$1&#039;);
      } else {
        st = st.trim();
        if (isAtLine) {
          st = st.slice(3);
        }
      }

      st = st.replace(`${this._cwd}/`, &#039;&#039;);

      if (st) {
        if (isAtLine) {
          if (lastNonAtLine) {
            result.push(lastNonAtLine);
            lastNonAtLine = null;
          }

          result.push(st);
        } else {
          outdent = true;
          lastNonAtLine = st;
        }
      }
    });

    return result.map(line =&gt; `${indent}${line}\n`).join(&#039;&#039;);
  }

  captureString (limit, fn = this.captureString) {
    if (typeof limit === &#039;function&#039;) {
      fn = limit;
      limit = Infinity;
    }

    const {stackTraceLimit} = Error;
    if (limit) {
      Error.stackTraceLimit = limit;
    }

    const obj = {};

    Error.captureStackTrace(obj, fn);
    const {stack} = obj;
    Error.stackTraceLimit = stackTraceLimit;

    return this.clean(stack);
  }

  capture (limit, fn = this.capture) {
    if (typeof limit === &#039;function&#039;) {
      fn = limit;
      limit = Infinity;
    }

    const {prepareStackTrace, stackTraceLimit} = Error;
    Error.prepareStackTrace = (obj, site) =&gt; {
      if (this._wrapCallSite) {
        return site.map(this._wrapCallSite);
      }

      return site;
    };

    if (limit) {
      Error.stackTraceLimit = limit;
    }

    const obj = {};
    Error.captureStackTrace(obj, fn);
    const { stack } = obj;
    Object.assign(Error, {prepareStackTrace, stackTraceLimit});

    return stack;
  }

  at (fn = this.at) {
    const [site] = this.capture(1, fn);

    if (!site) {
      return {};
    }

    const res = {
      line: site.getLineNumber(),
      column: site.getColumnNumber()
    };

    setFile(res, site.getFileName(), this._cwd);

    if (site.isConstructor()) {
      Object.defineProperty(res, &#039;constructor&#039;, {
        value: true,
        configurable: true,
      });
    }

    if (site.isEval()) {
      res.evalOrigin = site.getEvalOrigin();
    }

    // Node v10 stopped with the isNative() on callsites, apparently
    /* istanbul ignore next */
    if (site.isNative()) {
      res.native = true;
    }

    let typename;
    try {
      typename = site.getTypeName();
    } catch (_) {
    }

    if (typename &amp;&amp; typename !== &#039;Object&#039; &amp;&amp; typename !== &#039;[object Object]&#039;) {
      res.type = typename;
    }

    const fname = site.getFunctionName();
    if (fname) {
      res.function = fname;
    }

    const meth = site.getMethodName();
    if (meth &amp;&amp; fname !== meth) {
      res.method = meth;
    }

    return res;
  }

  parseLine (line) {
    const match = line &amp;&amp; line.match(re);
    if (!match) {
      return null;
    }

    const ctor = match[1] === &#039;new&#039;;
    let fname = match[2];
    const evalOrigin = match[3];
    const evalFile = match[4];
    const evalLine = Number(match[5]);
    const evalCol = Number(match[6]);
    let file = match[7];
    const lnum = match[8];
    const col = match[9];
    const native = match[10] === &#039;native&#039;;
    const closeParen = match[11] === &#039;)&#039;;
    let method;

    const res = {};

    if (lnum) {
      res.line = Number(lnum);
    }

    if (col) {
      res.column = Number(col);
    }

    if (closeParen &amp;&amp; file) {
      // make sure parens are balanced
      // if we have a file like &quot;asdf) [as foo] (xyz.js&quot;, then odds are
      // that the fname should be += &quot; (asdf) [as foo]&quot; and the file
      // should be just &quot;xyz.js&quot;
      // walk backwards from the end to find the last unbalanced (
      let closes = 0;
      for (let i = file.length - 1; i &gt; 0; i--) {
        if (file.charAt(i) === &#039;)&#039;) {
          closes++;
        } else if (file.charAt(i) === &#039;(&#039; &amp;&amp; file.charAt(i - 1) === &#039; &#039;) {
          closes--;
          if (closes === -1 &amp;&amp; file.charAt(i - 1) === &#039; &#039;) {
            const before = file.slice(0, i - 1);
            const after = file.slice(i + 1);
            file = after;
            fname += ` (${before}`;
            break;
          }
        }
      }
    }

    if (fname) {
      const methodMatch = fname.match(methodRe);
      if (methodMatch) {
        fname = methodMatch[1];
        method = methodMatch[2];
      }
    }

    setFile(res, file, this._cwd);

    if (ctor) {
      Object.defineProperty(res, &#039;constructor&#039;, {
        value: true,
        configurable: true,
      });
    }

    if (evalOrigin) {
      res.evalOrigin = evalOrigin;
      res.evalLine = evalLine;
      res.evalColumn = evalCol;
      res.evalFile = evalFile &amp;&amp; evalFile.replace(/\\/g, &#039;/&#039;);
    }

    if (native) {
      res.native = true;
    }

    if (fname) {
      res.function = fname;
    }

    if (method &amp;&amp; fname !== method) {
      res.method = method;
    }

    return res;
  }
}

function setFile (result, filename, cwd) {
  if (filename) {
    filename = filename.replace(/\\/g, &#039;/&#039;);
    if (filename.startsWith(`${cwd}/`)) {
      filename = filename.slice(cwd.length + 1);
    }

    result.file = filename;
  }
}

function ignoredPackagesRegExp(ignoredPackages) {
  if (ignoredPackages.length === 0) {
    return [];
  }

  const packages = ignoredPackages.map(mod =&gt; escapeStringRegexp(mod));

  return new RegExp(`[\/\\\\]node_modules[\/\\\\](?:${packages.join(&#039;|&#039;)})[\/\\\\][^:]+:\\d+:\\d+`)
}

const re = new RegExp(
  &#039;^&#039; +
    // Sometimes we strip out the &#039;    at&#039; because it&#039;s noisy
  &#039;(?:\\s*at )?&#039; +
    // $1 = ctor if &#039;new&#039;
  &#039;(?:(new) )?&#039; +
    // $2 = function name (can be literally anything)
    // May contain method at the end as [as xyz]
  &#039;(?:(.*?) \\()?&#039; +
    // (eval at &lt;anonymous&gt; (file.js:1:1),
    // $3 = eval origin
    // $4:$5:$6 are eval file/line/col, but not normally reported
  &#039;(?:eval at ([^ ]+) \\((.+?):(\\d+):(\\d+)\\), )?&#039; +
    // file:line:col
    // $7:$8:$9
    // $10 = &#039;native&#039; if native
  &#039;(?:(.+?):(\\d+):(\\d+)|(native))&#039; +
    // maybe close the paren, then end
    // if $11 is ), then we only allow balanced parens in the filename
    // any imbalance is placed on the fname.  This is a heuristic, and
    // bound to be incorrect in some edge cases.  The bet is that
    // having weird characters in method names is more common than
    // having weird characters in filenames, which seems reasonable.
  &#039;(\\)?)$&#039;
);

const methodRe = /^(.*?) \[as (.*?)\]$/;
