  <div class="row">
    <textarea id="file-source" class="col-md-12">var exec = require(&#039;child_process&#039;).exec;

var helpers = new (function () {
  var _tests;
  var _names = [];
  var _name;
  var _callback;
  var _runner = function () {
    if ((_name = _names.shift())) {
      console.log(&#039;Running &#039; + _name);
      _tests[_name]();
    }
    else {
      _callback();
    }
  };

  this.exec = function () {
    var args = Array.prototype.slice.call(arguments);
    var arg;
    var cmd = args.shift();
    var opts = {};
    var callback;
    // Optional opts/callback or callback/opts
    while ((arg = args.shift())) {
      if (typeof arg == &#039;function&#039;) {
        callback = arg;
      }
      else {
        opts = arg;
      }
    }

    cmd += &#039; --trace&#039;;
    var execOpts = opts.execOpts ? opts.execOpts : {};
    exec(cmd, execOpts, function (err, stdout, stderr) {
      var out = helpers.trim(stdout);
      if (err) {
        if (opts.breakOnError === false) {
          return callback(err);
        }
        else {
          throw err;
        }
      }
      if (stderr) {
        callback(stderr);
      }
      else {
        callback(out);
      }
    });
  };

  this.trim = function (s) {
    var str = s || &#039;&#039;;
    return str.replace(/^\s*|\s*$/g, &#039;&#039;);
  };

  this.parse = function (s) {
    var str = s || &#039;&#039;;
    str = helpers.trim(str);
    str = str.replace(/&#039;/g, &#039;&quot;&#039;);
    return JSON.parse(str);
  };

  this.run = function (tests, callback) {
    _tests = tests;
    _names = Object.keys(tests);
    _callback = callback;
    _runner();
  };

  this.next = function () {
    _runner();
  };

})();

module.exports = helpers;</textarea>
